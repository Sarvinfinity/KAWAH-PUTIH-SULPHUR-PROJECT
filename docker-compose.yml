version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./expanded_24H_all_data.csv:/app/expanded_24H_all_data.csv
      - ./models:/app/models
    restart: always

  frontend:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
